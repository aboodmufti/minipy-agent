[project]
name = "minipy"
version = "0.1.0"
description = "A minimal Harbor agent harness whose only tool is writing and running Python scripts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.8",
  "harbor>=0.26",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["minipy_agent"]
